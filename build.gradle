/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */
plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'com.library.framework'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.seleniumhq.selenium:selenium-java:4.18.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'org.testng:testng:7.9.0'
    implementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'io.qameta.allure:allure-testng:2.25.0'
    testImplementation 'net.datafaker:datafaker:2.1.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.12'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

test {
    useTestNG {
        suiteXmlFiles = [file("src/test/resources/testng.xml")]
    }

    testLogging {
        events "passed", "skipped", "failed"
    }
}